<!DOCTYPE html> 
<html lang="en">    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <title>Sign In</title>
    </head>

    <body>
        
       <h1 id="login-title">Login</h1>
       <div class = "signin-container">
            <form id="signin-form">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Sign In</button>
                <p id="errorMsg" style="color: red;"></p>
            </form>
        </div>

        <p><a href="signup.html">Create an account</a></p>

        <script src="api.js"></script>
        <script>
            $("#signin-form").submit(async function (e) {
                e.preventDefault();
    
                const email = $("#email").val();
                const password = $("#password").val();
                const errorMsg = $("#errorMsg");
    
                if (!email || !password) {
                    errorMsg.text("Please fill in both fields.");
                    return;
                }
    
                try {
                    const result = await apiCall("/signin_action.php", "GET", { email, password });
    
                    if (Number(result.status) === 200) {
                        localStorage.setItem("currentUser", JSON.stringify(result.data));
                        window.location.href = "index.html";
                    } else {
                        errorMsg.text(result.message);
                    }
                } catch (err) {
                    errorMsg.text("Something went wrong. Please try again.");
                }
            });
        </script>

    </body>
