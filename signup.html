<!DOCTYPE html> 
<html lang="en">    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <title>Sign Up</title>
    </head>

    <body>
    
    <h1 id="signup-title">Sign Up</h1>
    <div class="signup-container">
        <form id="signup-form">
            <label for="first-name">First Name:</label>
            <input type="text" id="first-name" name="first-name" required>

            <label for="last-name">Last Name:</label>
            <input type ="text" id="last-name" name="last-name" required>


            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" required>

            <button type="submit">Sign Up</button>
            <p id="errorMsg" style="color: red;"></p>
        
        </form>
    </div>

    <p><a href="signin.html">Already have an account? Sign In</a></p>

    <script src="api.js"></script>
    <script>
        $("#signup-form").submit(async function (e) {
            e.preventDefault();
 
            const firstName = $("#first-name").val();
            const lastName = $("#last-name").val();
            const email = $("#email").val();
            const password = $("#password").val();
            const confirmPassword = $("#confirm-password").val();
            const errorMsg = $("#errorMsg");
 
            if (!firstName || !lastName || !email || !password || !confirmPassword) {
                errorMsg.text("Please fill in all fields.");
                return;
            }
 
            if (password !== confirmPassword) {
                errorMsg.text("Passwords do not match.");
                return;
            }
 
            try {
                const result = await apiCall("/signup_action.php", "POST", {
                    first_name: firstName,
                    last_name: lastName,
                    email: email,
                    password: password,
                    confirm_password: confirmPassword
                });
 
                if (Number(result.status) === 200) {
                    window.location.href = "signin.html";
                } else {
                    errorMsg.text(result.message);
                }
            } catch (err) {
                errorMsg.text("Something went wrong. Please try again.");
            }
        });
    </script>

    </body>
